name: PR website preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build preview
        run: npm run build -- --base=./
        env:
          VITE_JOTFORM_WAITLIST_FORM_ID: ${{ vars.JOTFORM_WAITLIST_FORM_ID }}
      - name: Upload preview artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: website-preview-pr-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 7
      - name: Add preview instructions to PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ppc-pr-preview -->';
            const body = `${marker}\n### Website preview ready\n\nA fresh website build for this PR is available as a GitHub Actions artifact.\n\n1. Open the **PR website preview** workflow run.\n2. Download **website-preview-pr-${context.issue.number}** from the Artifacts section.\n3. Unzip it and open \`index.html\` in your browser.\n\nThis preview does **not** change www.pricklypearcareaz.org.\n\n[Open this preview workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
